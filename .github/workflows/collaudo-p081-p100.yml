name: Collaudo pubblico P081 P100 Linux e Windows
on:
  push:
    branches: [main]
    paths:
      - 'projects/P08*/**'
      - 'projects/P09*/**'
      - 'projects/P100/**'
      - 'tools/collaudo_p081_p100.py'
      - 'requirements-p081-p100.txt'
      - 'SOURCE_SHA256.json'
      - '.github/workflows/collaudo-p081-p100.yml'
      - '!projects/**/README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Installa le dipendenze
        run: python -m pip install -r requirements-p081-p100.txt
      - name: Verifica integrita compila ed esegue venti suite
        run: python -B tools/collaudo_p081_p100.py
